[project]
name = "aprendizaje-automatico-en-la-nube"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "evidently>=0.7.21",
    "imbalanced-learn>=0.14.2",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "mlflow>=2.17,<3",
    "numpy>=2.4.6",
    "optuna>=4.9.0",
    "pandas>=2.2,<3",
    "pandera>=0.32.1",
    "prefect>=3.8.4",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
